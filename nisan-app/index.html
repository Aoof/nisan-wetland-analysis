<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NISAN Flood Watch</title>
  <link rel="icon" href="data:," />
  <meta name="description" content="Flood and wetland watch for the lower Coatzacoalcos basin, from satellite radar, terrain and river forecasts." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" />
  <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />
  <style>:focus-visible { outline: 2px solid #2f6db5; outline-offset: 2px; }</style>
</head>
<body data-view="overview">
  <header class="topbar">
    <div class="brand"><b>NISAN</b><span>Coatzacoalcos basin</span></div>
    <nav class="views" role="tablist" aria-label="View">
      <button role="tab" data-view="overview" aria-selected="true">Overview</button>
      <button role="tab" data-view="authorities" aria-selected="false">Authorities</button>
    </nav>
    <form class="search" id="search" autocomplete="off" role="search">
      <input id="q" type="search" placeholder="Search a street, town, or lat, lon" aria-label="Search for a place" />
      <ul id="results" class="results" hidden></ul>
    </form>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings" aria-expanded="false" title="Settings">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5h8M15 5h2M3 10h2M9 10h8M3 15h10M17 15h0" stroke="currentColor" stroke-width="1.7" fill="none"/><circle cx="13" cy="5" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="7" cy="10" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="15" cy="15" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
    </button>
  </header>

  <div id="band" class="band" hidden></div>
  <main id="map" aria-label="Map"></main>

  <aside id="panel" class="panel" aria-live="polite">
    <button class="collapse" id="collapse" aria-label="Collapse panel" title="Collapse panel"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10.5 3 5.5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <div id="panelBody" class="panel-body"></div>
  </aside>

  <div id="legend" class="legend" aria-label="Map legend"></div>
  <aside id="settings" class="sheet" hidden aria-label="Settings"></aside>
  <footer id="timebar" class="timebar"></footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
